[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolgate"
version = "0.1.0"
description = "Tool-Call Firewall & Evidence Ledger for Autonomous AI Agents"
readme = "README.md"
authors = [{ name = "Ayyappa Pravin", email = "apravint@users.noreply.github.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security"
]
requires-python = ">=3.8"

[project.scripts]
toolgate = "toolgate.cli:main"

[project.urls]
Homepage = "https://github.com/apravint/toolgate"
Issues = "https://github.com/apravint/toolgate/issues"
